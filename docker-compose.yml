services:
  web:
    build: .
    container_name: web
    hostname: web
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/admin/login/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - main_network

  database:
    image: postgres:16-alpine
    container_name: database
    hostname: local_database
    restart: always
    env_file:
      - .env
    ports:
      - "6655:5432"
    volumes:
      - postgres_datastorage:/var/lib/postgresql/data
    networks:
      - main_network

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - main_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    build: .
    container_name: celery
    hostname: celery
    restart: always
    command: celery -A mysite worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
      - media_files:/app/media
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
      web:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - main_network

  celery-beat:
    build: .
    container_name: celery-beat
    hostname: celery-beat
    restart: always
    command: celery -A mysite beat -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
      celery:
        condition: service_started
    networks:
      - main_network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    hostname: nginx
    restart: always
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - main_network


volumes:
  static_files:
    driver: local
  media_files:
    driver: local
  postgres_datastorage:
    driver: local
  redis_data:
    driver: local

networks:
  main_network:
    driver: bridge