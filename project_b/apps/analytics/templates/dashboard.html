<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аналитика покупок</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { padding: 10px 15px; border: 1px solid #ddd; text-align: left; }
        th { background: #333; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
    </style>
</head>
<body>
    <h1>Аналитика покупок по пользователям</h1>
    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Всего потрачено</th>
                <th>Количество заказов</th>
            </tr>
        </thead>
        <tbody>
            {% for row in stats %}
            <tr>
                <td>{{ row.user_id }}</td>
                <td>{{ row.total_spent }} ₽</td>
                <td>{{ row.orders_count }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3">Пока нет данных</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
